<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login</title>
<style>
:root{{{ROOT_VARS}}}
body{background:var(--bg);font-family:"Segoe UI",monospace}
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px;width:340px}
.login-box h2{color:var(--accent);font-size:16px;margin-bottom:16px;text-align:center;letter-spacing:1px}
.login-box input{width:100%;margin-bottom:12px;background:{{INPUT_BG}};border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px;font-size:13px;outline:none;box-sizing:border-box}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:8px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:var(--accent);color:#000}
.login-box button:hover{background:{{ACCENT_HOVER}}}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h2><svg style="width:14px;height:14px;fill:currentColor;vertical-align:-2px"><path d="M1 2v12h14V2zm12 2v8H3V4zM5 6l1-1 3 3-3 3-1-1 2-2zm3 4h4v1H8z"/></svg> SHELL</h2>
    <form method="POST">
      <input type="password" name="__auth_pass" placeholder="Password" autofocus>
      <button type="submit">Authenticate</button>
    </form>
  </div>
</div>
<script>
// On submit, derive the AES key from the password client-side and stash
// it in sessionStorage so the post-login XHRs can encrypt without
// re-prompting. Falls through to a plain form submit if Web Crypto is
// missing (non-HTTPS context, ancient browser).
document.querySelector("form").addEventListener("submit", function(e) {
  e.preventDefault();
  var f = this, pw = f.__auth_pass.value;
  if (pw && window.crypto && window.crypto.subtle) {
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw)).then(function(h) {
      sessionStorage.setItem("__enc_key",
        Array.from(new Uint8Array(h)).map(function(b) {
          return b.toString(16).padStart(2, "0");
        }).join(""));
      f.submit();
    });
  } else {
    f.submit();
  }
});
</script>
</body>
</html>
